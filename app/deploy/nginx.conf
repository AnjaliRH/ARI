# /etc/nginx/sites-available/ari-editor  (symlink into sites-enabled)
# Reverse proxy -> Node app on 127.0.0.1:3000, TLS terminated here.
server {
    listen 80;
    server_name editor.example.com;
    return 301 https://$host$request_uri;     # force HTTPS
}

server {
    listen 443 ssl http2;
    server_name editor.example.com;

    # certs installed by certbot (see hosting instructions)
    ssl_certificate     /etc/letsencrypt/live/editor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/editor.example.com/privkey.pem;

    # Hard-deny anything sensitive, regardless of app behaviour.
    location ~ /\.(git|env) { deny all; return 404; }
    location ~ /\.          { deny all; return 404; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
